name: Update Fed Rate Data

on:
  schedule:
    # 평일만 KST 07:00 (Sun-Thu UTC 22:00 = Mon-Fri KST)
    - cron: '0 22 * * 0-4'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install requests
      - run: python fetch_rate_data.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add data/
          git diff --staged --quiet || git commit -m "📊 $(date +'%Y-%m-%d %H:%M') data update"
          git push
